# Intégration continue : formatage, lints, tests et compilation (Linux + Android).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Toolchain figée : un nouveau lint clippy ne casse pas la CI à l'improviste.
  # À monter volontairement (même valeur dans release.yml).
  RUST_VERSION: "1.93.1"
  NDK_VERSION: "27.3.13750724"

jobs:
  desktop:
    name: Desktop (Linux)
    # 22.04 = glibc 2.35 : comme le binaire publié, compatible avec les distributions plus anciennes.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: desktop
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Dépendances système (fenêtrage X11/Wayland)
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends pkg-config libxkbcommon-dev libwayland-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - name: Formatage
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked
      - name: Compilation release
        run: cargo build --release -p cydera --locked

  android:
    name: Android (APK debug)
    # 24.04 : le cargo-ndk précompilé exige glibc 2.39 (l'APK, lui, ne dépend pas de l'hôte).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      # SDK Android préinstallé sur les runners Ubuntu : on complète avec son sdkmanager.
      - name: SDK et NDK Android
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          {
            yes | "$SDKM" --licenses > /dev/null || true
            "$SDKM" --install "platforms;android-34" "build-tools;34.0.0" "ndk;$NDK_VERSION" > /dev/null
            ls "$ANDROID_HOME/ndk/$NDK_VERSION/toolchains" "$ANDROID_HOME/build-tools/34.0.0/aapt2"
          } > "$RUNNER_TEMP/sdk.log" 2>&1 || {
            echo "::error title=sdkmanager::ANDROID_HOME=$ANDROID_HOME%0A$(tail -20 "$RUNNER_TEMP/sdk.log" | sed -e ':a;N;$!ba' -e 's/%/%25/g;s/\r//g;s/\n/%0A/g')"
            exit 1
          }
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy
          targets: aarch64-linux-android, armv7-linux-androideabi
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: android
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Construction de l'APK (arm64 seulement en CI)
        env:
          CYDERA_ABIS: arm64-v8a
        # En cas d'échec, la fin du journal devient une annotation (lisible sans droits admin).
        run: |
          set -o pipefail
          apps/android/build-apk.sh debug 2>&1 | tee "$RUNNER_TEMP/apk.log" || {
            echo "::error title=build-apk.sh::$(grep -v Compiling "$RUNNER_TEMP/apk.log" | tail -30 | sed -e ':a;N;$!ba' -e 's/%/%25/g;s/\r//g;s/\n/%0A/g')"
            exit 1
          }
      - name: Clippy (cible Android)
        run: |
          cargo ndk -t arm64-v8a clippy -p cydera-android --locked -- -D warnings
      - name: Version de l'APK = version de Cargo.toml
        run: |
          V=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          "$ANDROID_HOME/build-tools/34.0.0/aapt2" dump badging target/apk/debug/cydera.apk | tee /tmp/badging | head -1
          grep -q "versionName='$V'" /tmp/badging || { echo "::error::versionName de l'APK différent de $V"; exit 1; }
      - uses: actions/upload-artifact@v7
        with:
          name: cydera-debug-apk
          path: target/apk/debug/cydera.apk
          retention-days: 7
      - name: Nettoyage des intermédiaires lourds
        if: always()
        run: rm -rf target/apk
