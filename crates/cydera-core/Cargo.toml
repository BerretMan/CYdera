[package]
name = "cydera-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Cydera : logique métier (Celcat, mails, resto, chrono), sans interface"

[dependencies]
reqwest.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
thiserror.workspace = true
tokio-rustls.workspace = true
webpki-roots.workspace = true
mailparse.workspace = true
getrandom = "0.4"
# Mises à jour : comparaison des versions publiées sur GitHub Releases.
semver = "1"
# Lecture des fiches ECTS (PDF) : seulement sur PC, Android n'embarque pas le parseur.
pdf-extract = { version = "0.12", optional = true }

[target.'cfg(not(target_os = "android"))'.dependencies]
dirs.workspace = true
# Mise à jour sur PC : vérification SHA-256 et extraction de l'archive .tar.gz.
sha2 = "0.10"
flate2 = "1"
tar = "0.4"


[features]
ects-pdf = ["dep:pdf-extract"]
